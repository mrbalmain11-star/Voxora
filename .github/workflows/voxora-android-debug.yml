name: Voxora Android Debug APK
# Trigger fresh build on current main after Kotlin configuration fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voxora-android-debug.yml'
      - 'android/settings.gradle.kts'
      - 'android/gradle/wrapper/gradle-wrapper.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter diagnostics
        run: flutter --version
      - name: Exclude development-only tools from debug build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          original = p.read_text()
          start = original.find('dev_dependencies:')
          end = original.find('\nflutter:', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate dev_dependencies section safely')
          p.write_text(original[:start] + original[end + 1:])
          print('Excluded development dependencies for CI build only')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.11902837"
      - name: Modernize legacy rating stars Android plugin for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["HOME"]) / ".pub-cache" / "hosted" / "pub.dev"
          packages = sorted(root.glob("animated_rating_stars-*/android/build.gradle"))
          if len(packages) != 1:
              raise SystemExit(f"Expected one rating stars Android Gradle file, found {len(packages)}")
          path = packages[0]
          path.write_text("""plugins {
              id 'com.android.library'
          }
          android {
              namespace 'com.example.animated_rating_stars'
              compileSdk 36
              defaultConfig {
                  minSdk 24
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """)
          print(f"Replaced legacy Android Gradle configuration in {path}")
          PY
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
