name: Voxora Android Debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voxora-android-debug.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter diagnostics
        run: flutter --version
      - name: Exclude development-only tools from debug build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pubspec.yaml')
          original = p.read_text()
          updated, count = re.subn(r'(?ms)^dev_dependencies:\\s*\\n.*?(?=^flutter:\\s*$)', '', original)
          if count != 1:
              raise SystemExit('Could not locate dev_dependencies section safely')
          p.write_text(updated)
          print('Excluded development dependencies for CI build only')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
